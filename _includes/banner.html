<section id="banner"{% if page.banner_blurred != false %} class="blurred"{% endif %}>
    <div class="banner-content"{% if page.banner_image %} style="background-color: rgba(0, 0, 0, 0);"{% endif %}>
        {% if page.banner_image %}
        {% assign banner_ext = page.banner_image | split: "." | last %}
        <picture>
            {% unless banner_ext == "svg" %}<source srcset="images/{{ page.banner_image | replace: '.png', '.webp' | replace: '.jpg', '.webp' }}" type="image/webp">{% endunless %}
            <img src="images/{{ page.banner_image }}" alt="{{ page.banner_title }}" style="width: 40%; height: auto;">
        </picture>
        {% else %}
        <h2 style="font-weight: bold;">{{ page.banner_title }}</h2>
        {% if page.banner_subtitle %}
        <p>{{ page.banner_subtitle }}</p>
        {% endif %}
        {% endif %}
    </div>
</section>
