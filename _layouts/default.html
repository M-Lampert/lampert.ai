<html lang="en">

<head>
    <title>{{ page.title }}</title>
    <meta charset="utf-8" />
    <!-- Apply the saved/OS colour scheme before first paint to avoid a flash -->
    <script>
        (function () {
            var t = localStorage.getItem("theme");
            if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
            if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description }}" />
    <meta name="author" content="{{ site.author }}" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />
    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="{{ page.og_description | default: page.description }}" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta property="og:image" content="{{ site.url }}/images/{{ page.og_image | default: 'moritz.png' }}" />
    <!-- Twitter / X cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title }}" />
    <meta name="twitter:description" content="{{ page.og_description | default: page.description }}" />
    <meta name="twitter:image" content="{{ site.url }}/images/{{ page.og_image | default: 'moritz.png' }}" />
    <!-- Icons / theme colour -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="assets/css/main.css" />
    {% if page.map %}
    <!-- Leaflet (self-hosted) — only loaded on map pages -->
    <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="assets/vendor/leaflet/MarkerCluster.css" />
    <link rel="stylesheet" href="assets/vendor/leaflet/MarkerCluster.Default.css" />
    {% endif %}
    {% if page.url == "/" %}
    <!-- Structured data: the site owner -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Moritz Lampert",
            "url": "{{ site.url }}",
            "image": "{{ site.url }}/images/moritz.png",
            "jobTitle": "PhD Student",
            "affiliation": { "@type": "CollegeOrUniversity", "name": "University of Würzburg" },
            "sameAs": [
                "https://www.linkedin.com/in/moritz-lampert-824423210/",
                "https://scholar.google.com/citations?user=rNn9WJ4AAAAJ",
                "https://orcid.org/0009-0007-6692-5646",
                "https://github.com/M-Lampert"
            ]
        }
    </script>
    {% endif %}
</head>

<body class="landing is-preload{% if page.map %} has-map{% endif %}">
    <div id="page-wrapper">

        <!-- Header -->
        {% include header.html %}

        <!-- Dark-mode toggle (fixed, works on all viewports) -->
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">{% include icons/moon.svg %}{% include icons/sun.svg %}</button>

        <!-- Banner -->
        {% include banner.html %}

        <!-- Main -->
        <section id="network">
            <section id="main" class="container">
{{ content }}
            </section>
        </section>

        <!-- Footer -->
        {% include footer.html %}

    </div>

    <!-- Scripts (deferred: execute in order after parsing, off the critical path).
         Third-party libraries live in assets/vendor/; template + custom code in assets/js/. -->
    <script defer src="assets/vendor/jquery/jquery.min.js"></script>
    <script defer src="assets/vendor/dropotron/jquery.dropotron.min.js"></script>
    <script defer src="assets/vendor/scrollex/jquery.scrollex.min.js"></script>
    <script defer src="assets/vendor/browser/browser.min.js"></script>
    <script defer src="assets/vendor/breakpoints/breakpoints.min.js"></script>
    <script defer src="assets/js/util.js"></script>
    <script defer src="assets/js/main.js"></script>

    <script defer src="assets/js/network.js"></script>

    <script defer src="assets/js/theme-toggle.js"></script>

    {% if page.map %}
    <!-- Leaflet map (self-hosted), only on map pages -->
    <script defer src="assets/vendor/leaflet/leaflet.js"></script>
    <script defer src="assets/vendor/leaflet/leaflet.markercluster.js"></script>
    <script defer src="assets/js/talks-map.js"></script>
    {% endif %}

</body>

</html>
