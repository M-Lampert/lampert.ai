<html lang="en">

<head>
    <title>{{ page.title }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.description }}" />
    <meta name="author" content="{{ site.author }}" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />
    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="{{ page.og_description | default: page.description }}" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta property="og:image" content="{{ site.url }}/images/{{ page.og_image | default: 'moritz.png' }}" />
    <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body class="landing is-preload">
    <div id="page-wrapper">

        <!-- Header -->
        {% include header.html %}

        <!-- Banner -->
        {% include banner.html %}

        <!-- Main -->
        <section id="network">
            <section id="main" class="container">
{{ content }}
            </section>
        </section>

        <!-- Footer -->
        {% include footer.html %}

    </div>

    <!-- Scripts (deferred: execute in order after parsing, off the critical path) -->
    <script defer src="assets/js/jquery.min.js"></script>
    <script defer src="assets/js/jquery.dropotron.min.js"></script>
    <script defer src="assets/js/jquery.scrollex.min.js"></script>
    <script defer src="assets/js/browser.min.js"></script>
    <script defer src="assets/js/breakpoints.min.js"></script>
    <script defer src="assets/js/util.js"></script>
    <script defer src="assets/js/main.js"></script>

    <script defer src="assets/js/d3.v7.min.js"></script>
    <script defer src="assets/js/network.js"></script>

</body>

</html>
