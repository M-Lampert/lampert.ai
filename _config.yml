# Site settings — shared across all pages
title: Moritz Lampert
author: Moritz Lampert
url: https://lampert.ai
description: >-
  Moritz Lampert is a PhD student in Machine Learning for Complex Networks at
  the University of Würzburg, researching graph representation learning,
  temporal graphs, and applications in single-cell biology.

# Build settings
sass:
  sass_dir: _sass
  style: compressed # minified CSS for production
  sourcemap: never # keep output clean

exclude:
  - README.md
  - .devcontainer
  - Gemfile
  - Gemfile.lock
  - inspiration # reference repos — not part of the published site
  - scripts # build helpers (e.g. image optimizer)
